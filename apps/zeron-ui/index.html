<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#060606" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon-32x32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>L7 Code</title>
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        background: #060606;
        color: #e8e8ea;
      }
      #boot-shell {
        display: grid;
        place-items: center;
        min-height: 100%;
        font-family: Geist, ui-sans-serif, system-ui, sans-serif;
        letter-spacing: -0.04em;
        background:
          radial-gradient(900px 520px at 18% 12%, rgba(139, 124, 246, 0.16), transparent 58%),
          #060606;
      }
      #boot-shell .mark {
        display: inline-flex;
        align-items: center;
        gap: 10px;
      }
      #boot-shell .glyph {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        display: grid;
        place-items: center;
        font-size: 12px;
        font-weight: 700;
        color: #121214;
        background: linear-gradient(180deg, #f4f4f6, #d4d4d8);
      }
      #boot-shell strong {
        font-size: 22px;
        font-weight: 600;
      }
      #boot-shell span {
        opacity: 0.45;
        margin-left: 2px;
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-shell">
        <div class="mark">
          <div class="glyph">L7</div>
          <div>
            <strong>L7 Code</strong>
            <span> Zeron</span>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
